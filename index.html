<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Urban Streetwear Business Operating System for Strategic Management and Growth"
    />
    <meta
      name="keywords"
      content="business, management, strategy, streetwear, operations, dashboard"
    />
    <meta name="author" content="CORNMAN Strategic HQ" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#39FF14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CORNMAN HQ" />
    <meta name="application-name" content="CORNMAN HQ" />
    <meta name="msapplication-TileColor" content="#39FF14" />
    <meta name="msapplication-navbutton-color" content="#39FF14" />

    <!-- Open Graph Tags -->
    <meta property="og:title" content="CORNMAN - Strategic HQ" />
    <meta property="og:description" content="Urban Streetwear Business Operating System" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.ico" />

    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CORNMAN - Strategic HQ" />
    <meta name="twitter:description" content="Urban Streetwear Business Operating System" />
    <meta name="twitter:image" content="/favicon.ico" />

    <title>CORNMAN - Strategic HQ | Urban Streetwear Business OS</title>

    <!-- Tailwind CSS handled by build process -->

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Teko:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: 'Roboto Mono', monospace;
      }

      /* Custom utilities */
      .text-brand-gradient {
        background: linear-gradient(135deg, #39ff14, #2ecc11);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .btn-brand {
        background: #39ff14;
        color: #121212;
        font-family: 'Teko', sans-serif;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        transition: all 0.2s ease-in-out;
      }

      .btn-brand:hover {
        background: #2ecc11;
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
      }

      .btn-brand:active {
        transform: scale(0.98);
      }

      .card-dark {
        background: #1e1e1e;
        border: 1px solid #333333;
        border-radius: 0.5rem;
      }

      .card-glass {
        backdrop-filter: blur(8px);
        background: rgba(30, 30, 30, 0.8);
        border: 1px solid #333333;
        border-radius: 0.5rem;
      }

      /* Phone dragging styles */
      body.dragging-phone,
      body.dragging-phone * {
        user-select: none;
        cursor: grabbing !important;
      }

      /* Light mode styles */
      .light {
        --tw-bg-opacity: 1;
        background-color: rgb(250 250 250 / var(--tw-bg-opacity));
        color: rgb(33 33 33);
      }
    </style>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="bg-[#121212] text-[#E0E0E0] p-4 md:p-8">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
